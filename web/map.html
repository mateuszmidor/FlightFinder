    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"

    <!-- CesiumJS -->
    <script>
        window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/';
    </script>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <!-- My page scripting -->
    <script type="text/javascript">
        var viewer = null
        var jsonPaths = null

        //<![CDATA[
        $(document).ready(function () {
            createEarthMap();
        });

        function createEarthMap() {
            $("#mapContainer").html('')
            Cesium.Ion.defaultAccessToken = null;
            viewer = new Cesium.Viewer('mapContainer', {
                baseLayer: false,
                baseLayerPicker: false,
                geocoder: false,
                homeButton: false,
                sceneModePicker: false,
                selectionIndicator: false,
                timeline: false,
                animation: false,
                fullscreenButton: false,
                navigationHelpButton: false,
                shouldAnimate: false,
            });
            viewer.scene.globe.enableLighting = false;
            viewer.imageryLayers.addImageryProvider(
                new Cesium.UrlTemplateImageryProvider({
                    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    subdomains: 'abc',
                    minimumLevel: 0,
                    maximumLevel: 19
                })
            );
        }

        function getRandomColor() {
            return Cesium.Color.fromRandom({ alpha: 0.9 });
        }

        function addAirportMarker(code, name, nationFullName, lon, lat, color) {
            color = color || Cesium.Color.RED;
            // validate the airport
            if (typeof lon === 'undefined' || typeof lat === 'undefined') {
                console.log("Airport marker invalid:", {
                    code: code,
                    name: name,
                    nationFullName: nationFullName,
                    lon: lon,
                    lat: lat
                });
                return;
            }
            var entity = viewer.entities.add({
                name: code,
                position: Cesium.Cartesian3.fromDegrees(lon, lat),
                billboard: {
                    image: createAirportPinCanvas(color),
                    width: 24,
                    height: 32,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                },
                label: {
                    text: code,
                    font: 'bold 12px sans-serif',
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -32),
                },
                description: '<strong>' + code + '</strong><br>' + name + ', ' + nationFullName,
            });
            return entity;
        }

        function createAirportPinCanvas(color) {
            var canvas = document.createElement('canvas');
            canvas.width = 24;
            canvas.height = 32;
            var ctx = canvas.getContext('2d');
            var r = Math.floor(color.red * 255);
            var g = Math.floor(color.green * 255);
            var b = Math.floor(color.blue * 255);
            ctx.beginPath();
            ctx.moveTo(12, 32);
            ctx.bezierCurveTo(12, 24, 0, 16, 0, 10);
            ctx.arc(12, 10, 12, Math.PI, 0, false);
            ctx.bezierCurveTo(24, 16, 12, 24, 12, 32);
            ctx.closePath();
            ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(12, 10, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            return canvas.toDataURL();
        }

        function addFlightPathSegment(fromLon, fromLat, toLon, toLat, color, width) {
            color = color || Cesium.Color.RED;
            width = width || 3;
            viewer.entities.add({
                polyline: {
                    positions: Cesium.Cartesian3.fromDegreesArrayHeights([
                        fromLon, fromLat, 0,
                        toLon, toLat, 0
                    ]),
                    width: width,
                    material: new Cesium.PolylineGlowMaterialProperty({
                        glowPower: 0.15,
                        color: color,
                    }),
                    arcType: Cesium.ArcType.GEODESIC,
                },
            });
        }

        function helo(index) {
            alert(`clicked path no. ${index}`)
        }

        function makeItem(itemIndex) {
            return `<a class="list-group-item list-group-item-action narrow-item" id="list-home-list" data-toggle="list" href="#list-home" role="tab" aria-controls="home" onclick="showPath(${itemIndex})" >`
        }

        function showPath(pathIndex) {
            createEarthMap()
            var uniqueAirports = new Map();
            var airportList = [];

            value = jsonPaths[pathIndex]
            uniqueAirports.set(value.from_airport.code, value.from_airport)
            airportList.push(value.from_airport)

            $.each(value.segments, function (index, value) {
                uniqueAirports.set(value.to_airport.code, value.to_airport)
                airportList.push(value.to_airport)
            });

            for (const airport of uniqueAirports.values()) {
                addAirportMarker(airport.code, airport.name, airport.nation_full_name, airport.lon, airport.lat, Cesium.Color.RED);
            }

            for (var i = 0; i < airportList.length - 1; i++) {
                addFlightPathSegment(
                    airportList[i].lon, airportList[i].lat,
                    airportList[i + 1].lon, airportList[i + 1].lat,
                    Cesium.Color.RED, 4
                );
            }

            viewer.zoomTo(viewer.entities);
        }

        function renderJSONPathsAsHTML(paths) {
            // clear paths
            $("#pathsContainer").html("");

            // render paths
            $.each(paths, function (index, path) {
                var htmlPath = renderJSONPathAsHTML(path)
                $("#pathsContainer").append(makeItem(index) + htmlPath + "</a>")
            });
        }

        function renderJSONPathAsHTML(jsonPath) {
            var htmlPath = jsonPath.from_airport.name
            $.each(jsonPath.segments, function (index, value) {
                htmlPath += "-" + "<strong>(" + value.carrier.code + ")</strong>";
                htmlPath += "-" + value.to_airport.name;
            });
            return htmlPath
        }

        function markAirportsOnEarth(paths) {
            createEarthMap()
            var uniqueAirports = new Map();

            $.each(paths, function (index, value) {
                uniqueAirports.set(value.from_airport.code, value.from_airport)

                $.each(value.segments, function (index, value) {
                    uniqueAirports.set(value.to_airport.code, value.to_airport)
                });
            });

            for (const airport of uniqueAirports.values()) {
                addAirportMarker(airport.code, airport.name, airport.nation_full_name, airport.lon, airport.lat);
            }

            $.each(paths, function (index, path) {
                var airportList = [];
                airportList.push(path.from_airport)
                $.each(path.segments, function (segIndex, segment) {
                    airportList.push(segment.to_airport)
                });

                var color = getRandomColor();
                for (var i = 0; i < airportList.length - 1; i++) {
                    addFlightPathSegment(
                        airportList[i].lon, airportList[i].lat,
                        airportList[i + 1].lon, airportList[i + 1].lat,
                        color, 3
                    );
                }
            });

            viewer.zoomTo(viewer.entities);
        }

        function markAirportsListOnEarth(airports) {
            createEarthMap()
            console.log("Number of airports:", airports.length);
            for (const airport of airports) {
                console.log(`Airport #${airports.indexOf(airport)} code: ${airport.code}`);
                addAirportMarker(airport.code, airport.name, airport.nation_full_name, airport.lon, airport.lat);
            }

            viewer.zoomTo(viewer.entities);
        }


        function setFindResults(paths) {
            jsonPaths = paths
            renderJSONPathsAsHTML(paths)
            markAirportsOnEarth(paths)
        }

        function setAirportsResults(airports) {
            jsonAirports = airports
            markAirportsListOnEarth(airports)
        }


        var onFindConnections = function () {
            $.ajax({
                type: 'GET',
                url: 'api/find',
                dataType: 'json',
                contentType: 'application/json',
                data: { from: $("#fromairport").val(), to: $("#toairport").val(), maxsegmentcount: $("#maxsegmentcount").val() },
                error: function (response) {
                    console.log(response);
                    if (response.status == 400) {
                        alert(response.responseJSON.error);
                    }
                    else {
                        alert(response.statusText);
                    }
                },
                success: function (pathArray) {
                    if (pathArray.length == 0) {
                        alert("nothing found")
                    } else {
                        setFindResults(pathArray);
                    }
                }
            });
        }

        var onShowAirports = function () {
            $.ajax({
                type: 'GET',
                url: 'api/airports',
                dataType: 'json',
                contentType: 'application/json',
                data: {},
                error: function (response) {
                    console.log(response);
                    if (response.status == 400) {
                        alert(response.responseJSON.error);
                    }
                    else {
                        alert(response.statusText);
                    }
                },
                success: function (airportList) {
                    if (airportList.length == 0) {
                        alert("no airports available")
                    } else {
                        setAirportsResults(airportList);
                    }
                }
            });
        }


        //]]>
    </script>
</head>

<body>
    <div class="container-fluid">
        <!-- RESULTS: LIST ON LEFT, MAP ON RIGHT -->
        <div class="row">
            <div class="resultList" style="background-color:#aaa; overflow:auto;" id="pathsContainer2">
                <div class="col-4" style="padding-left: 10px;">
                    <div class="list-group " id="pathsContainer" role="tabl`ist">
                    </div>
                </div>
            </div>
            <div class="rightPane" style="background-color:rgb(138, 128, 128);">
                <!-- FLIGHT SEARCH INPUT -->
                <form class="form-inline" id="formbig" role="form" method="get" action="">
                    <div class="form-group">
                        <label class="sr-only" for="fromairport">From:</label>
                        <input type="text" class="form-control" placeholder="krk" id="fromairport" name="fromairport"

                    </div>
                    <div class="form-group">
                        <label class="sr-only" for="toairport">To:</label>
                        <input type="text" class="form-control" placeholder="gdn" id="toairport" name="toairport"

                        </findbutton>
                        <findbutton class="btn btn-danger" onclick="onShowAirports()">

                        </findbutton>
                    </div>
                </form>

                <!-- MAP DRAWING AREA -->
                <div class="earthMap" style="background-color:rgb(44, 133, 9);" id="mapContainer">
